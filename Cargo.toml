[package]
name = "vimprover"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Intelligently re-encodes, repairs, and modernizes media files."
license = "MIT OR Apache-2.0"
readme = "README.md"
publish = false

[lib]
name = "vimprover"
path = "src/lib.rs"

[[bin]]
name = "vimprover"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
which = "7"

[dev-dependencies]
pretty_assertions = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
